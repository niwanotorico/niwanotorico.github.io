<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちきとぴよ図鑑</title>
<style>
  :root{
    --cream:#fff7ee;
    --peach:#ffe9d6;
    --brown:#7a5b46;
    --accent:#f6a04d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,var(--cream) 0%,var(--peach) 100%);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    color:var(--brown);
    padding:24px;
  }
  .card{
    width:min(720px,100%);
    text-align:center;
  }
  .badge{
    display:inline-block;
    background:#fff;
    color:var(--accent);
    font-weight:700;
    font-size:14px;
    padding:8px 18px;
    border-radius:999px;
    box-shadow:0 4px 14px rgba(122,91,70,.12);
    margin-bottom:20px;
    letter-spacing:.04em;
  }
  .art{
    width:100%;
    border-radius:24px;
    display:block;
    box-shadow:0 16px 40px rgba(122,91,70,.18);
  }
  h1{
    font-size:26px;
    margin-top:28px;
    letter-spacing:.06em;
  }
  p{
    margin-top:12px;
    font-size:15px;
    line-height:1.9;
    color:#9a8069;
  }
  .sublink{
    margin-top:26px;
    font-size:13px;
  }
  .sublink a{
    color:#b79a7f;
    text-decoration:none;
    border-bottom:1px dotted #cbb8a0;
    padding-bottom:2px;
    transition:color .2s;
  }
  .sublink a:hover{color:var(--accent);}
  @media(max-width:480px){
    h1{font-size:22px;}
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">ちきとぴよ図鑑</span>
    <img class="art" src="images/closed.jpg" alt="ちきとぴよ家族">
    <h1>ただいま おやすみ中です</h1>
    <p>いつもありがとうございます。<br>ちきとぴよ図鑑は、ただいまお休みしています。<br>また あいましょう。</p>
    <p class="sublink"><a href="coin/">コインミッション →</a></p>
  </main>
</body>
</html>
